name: Windows pull request validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ./src/desktop-windows/NetSpeed.GameBoost.Desktop.csproj --runtime win-x64
      - name: Build
        run: dotnet build ./src/desktop-windows/NetSpeed.GameBoost.Desktop.csproj --configuration Release --runtime win-x64 --no-restore
