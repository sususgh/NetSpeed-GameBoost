name: Build Windows Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'src/desktop-windows/**'
      - '.github/workflows/windows-release.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-win-x64:
    name: Publish self-contained Windows x64 app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ./src/desktop-windows/NetSpeed.GameBoost.Desktop.csproj
      - name: Build
        run: dotnet build ./src/desktop-windows/NetSpeed.GameBoost.Desktop.csproj --configuration Release --no-restore
      - name: Publish self-contained single-file app
        run: dotnet publish ./src/desktop-windows/NetSpeed.GameBoost.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output ./artifacts/publish/win-x64
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = './artifacts/publish/win-x64/NetSpeed.GameBoost.Desktop.exe'
          if (!(Test-Path $exe)) { throw 'Published executable was not found.' }
          $item = Get-Item $exe
          if ($item.Length -lt 1MB) { throw 'Published executable is unexpectedly small.' }
          Write-Host "Verified $($item.FullName) ($($item.Length) bytes)"
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path './artifacts/publish/win-x64/*' -DestinationPath './artifacts/NetSpeed-GameBoost-Windows-x64.zip' -Force
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-GameBoost-Windows-x64
          path: ./artifacts/NetSpeed-GameBoost-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
